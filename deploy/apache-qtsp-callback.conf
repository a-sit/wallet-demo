# Frontend-Proxy apps.egiz.gv.at (Apache), in der Konfiguration dieses vHosts
# bei den Einträgen für /qtsp. Benötigt mod_substitute und mod_filter (a2enmod substitute filter).
#
# Der QTSP antwortet nach der Wallet-Authentisierung (OpenID4VP direct_post) mit
#   {"redirect_uri":"asitplus-wallet://wallet.a-sit.plus/app/callback/signing?code=…&state=…"}
# Valera (VC-K) öffnet dort nur https-URIs. Die Antwort wird daher auf die https-Brücke des PoC umgeschrieben,
# die per 302 in die App zurückleitet (GET /wallet-callback/app/callback/signing). Nur diese eine Antwort ist betroffen.
<Location /qtsp/oauth2/siop/response/>
    RequestHeader unset Accept-Encoding
    AddOutputFilterByType SUBSTITUTE application/json
    Substitute "s|asitplus-wallet://wallet.a-sit.plus/app/callback/|https://wallet-demo.a-sit.at/wallet-callback/app/callback/|n"
</Location>
