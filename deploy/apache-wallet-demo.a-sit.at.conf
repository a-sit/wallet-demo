# Frontend-Proxy wallet-demo.a-sit.at (Apache):
# /etc/apache2/sites-available/wallet-demo.a-sit.at.conf
#
# Auf Port 80 Namens-vHosts (*:80) verwenden – ein vHost mit fester Adresse würde dort allen HTTP-Verkehr
# an sich ziehen. Sind die übrigen HTTPS-vHosts IP-basiert (<proxy-ip>:443), käme ein *:443-vHost gegen
# diese nie zum Zug – daher dort dieselbe Adresse, Auswahl per ServerName/SNI.
#
# Reihenfolge: erst nur den :80-Block aktivieren, Zertifikat mit
#   mkdir -p /var/www/wallet-demo/html
#   certbot certonly --webroot -w /var/www/wallet-demo/html -d wallet-demo.a-sit.at
# holen (ohne das Apache-Plugin von certbot), dann den :443-Block
# einkommentieren und Apache neu laden.
# Backend: PUBLIC_URL=https://wallet-demo.a-sit.at in der systemd-Unit auf dem Backend-Server.

<VirtualHost *:80>
    ServerName wallet-demo.a-sit.at
    DocumentRoot /var/www/wallet-demo/html

    # alles auf HTTPS, außer der ACME-Challenge für certbot
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://wallet-demo.a-sit.at%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/wallet-demo-error.log
    CustomLog ${APACHE_LOG_DIR}/wallet-demo-access.log combined
</VirtualHost>

